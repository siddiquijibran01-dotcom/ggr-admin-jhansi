<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Golden Green Recipe - Admin</title>
</head>
<body>
  <h2>Golden Green Recipe - Firebase Connected ✅</h2>
  <p id="status">Connecting to Firebase...</p>

  <!-- Firebase CDN (Modular v10+) -->
  <script type="module">
    // Import Firebase functions from CDN
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
    import { getFirestore } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    // 🔑 Aapka Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyA9vmRlUsHetjuD7L1l-DxtQwn7WPW6T7I",
      authDomain: "golden-green-recipe.firebaseapp.com",
      projectId: "golden-green-recipe",
      storageBucket: "golden-green-recipe.firebasestorage.app",
      messagingSenderId: "952103785525",
      appId: "1:952103785525:web:06a9eeb8d33364446e4d7c"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Status update
    document.getElementById("status").innerText = "Firebase Connected 🎉";
    import { collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

// Example: Data add karna
async function addRecipe() {
  try {
    await addDoc(collection(db, "recipes"), {
      name: "Chicken Biryani",
      price: 250,
      type: "Non-Veg"
    });
    console.log("Recipe Added ✅");
  } catch (e) {
    console.error("Error adding recipe: ", e);
  }
}

// Example: Data read karna
async function getRecipes() {
  const querySnapshot = await getDocs(collection(db, "recipes"));
  querySnapshot.forEach((doc) => {
    console.log(doc.id, " => ", doc.data());
  });
}

// Page load hote hi test ke liye call
addRecipe();
getRecipes();
  </script>
</body>
</html>
